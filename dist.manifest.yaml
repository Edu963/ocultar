# Ocultar Distribution Manifest
# This file defines the files and binaries included in Ocultar releases.
# It is used by the client-package-updater skill and the build_release.sh script.

version: "2.1.1"

distributions:
  default:
    name: "ocultar"
    format: "zip"
    components:
      - name: "refinery"
        src: "./services/refinery/cmd/main.go"
        type: "go-binary"
        dest: "ocultar"
      - name: "dashboard"
        src: "./apps/dashboard"
        type: "npm-build"
        dest: "dashboard"
      - name: "docker-compose"
        src: "./docker-compose.yml"
        type: "file"
        dest: "docker-compose.yml"
      - name: "env-example"
        src: "./.env.example"
        type: "file"
        dest: ".env.example"
      - name: "privacy-filter-src"
        src: "./apps/slm-engine/python"
        type: "directory"
        dest: "apps/slm-engine/python"
      - name: "scripts"
        src: "./tools/scripts/scripts"
        type: "directory"
        include:
          - "setup-community.sh"
          - "setup-community.ps1"
          - "integrity_validator.sh"
          - "run_secret_scanner.sh"
          - "run_zero_egress_validator.sh"
          - "smoke_test.sh"
        dest: "scripts/"
      - name: "config-template"
        src: "./services/refinery/configs/config.yaml"
        type: "file"
        dest: "config.yaml"
      - name: "mock-api"
        src: "./services/mock-api/main.go"
        type: "go-binary"
        dest: "mock-api"
        optional: true
      - name: "slm-engine"
        src: "./apps/slm-engine/main.go"
        type: "go-binary"
        dest: "slm-engine"
        optional: true
      - name: "riskreport"
        src: "./services/refinery/cmd/riskreport/main.go"
        type: "go-binary"
        dest: "riskreport"
        optional: true
      - name: "leaky-demo"
        src: "./datasets/leaky_demo.json"
        type: "file"
        dest: "datasets/leaky_demo.json"
        optional: true
      - name: "integrity-manifest"
        src: "./security/dashboard_integrity.json"
        type: "file"
        dest: "security/dashboard_integrity.json"
      - name: "mapping-config"
        src: "./services/refinery/configs/mapping.json"
        type: "file"
        dest: "services/refinery/configs/mapping.json"

# Mandatory Security Checks for all components
security:
  sanitization: true
  egress_audit: true
  cryptographic_gating: true

# Validation Profile
validation:
  default:
    test_script: "scripts/setup-community.sh"
    allowed_ports: [8081, 3030]
    required_signatures: ["ocultar.zip.sig"]
